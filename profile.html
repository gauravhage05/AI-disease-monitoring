{% extends "layout.html" %}
{% block title %}My Health Profile{% endblock %}
{% block page_title %}My Health Profile{% endblock %}
{% block content %}
<div class="page-card">
  <div class="card-section-header">
    <h3>Personal & Medical Information</h3>
    <span class="patient-code-tag">ID: {{ patient.patient_code }}</span>
  </div>
  <form method="POST" action="{{ url_for('patient_profile') }}" class="profile-form">
    <div class="form-section-title">Personal Information</div>
    <div class="form-grid-3">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" value="{{ current_user.full_name }}" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" value="{{ current_user.email }}" disabled>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone" value="{{ current_user.phone or '' }}">
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" name="date_of_birth" value="{{ patient.date_of_birth.isoformat() if patient.date_of_birth else '' }}">
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select name="gender">
          <option value="">Select</option>
          {% for g in ['Male','Female','Other','Prefer not to say'] %}
          <option value="{{ g }}" {{ 'selected' if patient.gender == g else '' }}>{{ g }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Blood Group</label>
        <select name="blood_group">
          <option value="">Select</option>
          {% for bg in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}
          <option value="{{ bg }}" {{ 'selected' if patient.blood_group == bg else '' }}>{{ bg }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Height (cm)</label>
        <input type="number" name="height_cm" value="{{ patient.height_cm or '' }}" step="0.1" min="50" max="250">
      </div>
      <div class="form-group">
        <label>Weight (kg)</label>
        <input type="number" name="weight_kg" value="{{ patient.weight_kg or '' }}" step="0.1" min="10" max="300">
      </div>
      <div class="form-group">
        <label>BMI (auto-calculated)</label>
        <input type="text" value="{{ patient.bmi or 'Will calculate from height/weight' }}" disabled>
      </div>
    </div>

    <div class="form-section-title">Medical Information</div>
    <div class="form-grid-2">
      <div class="form-group">
        <label>Primary Chronic Condition</label>
        <select name="primary_disease">
          <option value="">Select condition</option>
          {% for d in ['Type 1 Diabetes Mellitus','Type 2 Diabetes Mellitus','Hypertension (Stage 1)','Essential Hypertension (Stage 2)','Coronary Artery Disease','Chronic Heart Failure','Atrial Fibrillation','Chronic Kidney Disease','Chronic Obstructive Pulmonary Disease','Other Chronic Condition'] %}
          <option value="{{ d }}" {{ 'selected' if patient.primary_disease == d else '' }}>{{ d }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Emergency Contact</label>
        <input type="text" name="emergency_contact" value="{{ patient.emergency_contact or '' }}" placeholder="Name & phone number">
      </div>
      <div class="form-group span-2">
        <label>Allergies</label>
        <textarea name="allergies" rows="2" placeholder="List any known allergies (medications, food, etc.)">{{ patient.allergies or '' }}</textarea>
      </div>
      <div class="form-group span-2">
        <label>Family Medical History</label>
        <textarea name="family_history" rows="2" placeholder="Relevant family history (e.g. diabetes in parents)">{{ patient.family_history or '' }}</textarea>
      </div>
      <div class="form-group span-2">
        <label>Previous Medical History</label>
        <textarea name="previous_history" rows="2" placeholder="Previous surgeries, hospitalizations, major illnesses">{{ patient.previous_history or '' }}</textarea>
      </div>
      <div class="form-group span-2">
        <label>Address (optional)</label>
        <textarea name="address" rows="2">{{ patient.address or '' }}</textarea>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary">Save Profile</button>
      <a href="{{ url_for('patient_dashboard') }}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
